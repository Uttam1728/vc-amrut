<!doctype html>
<html lang="gu" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="વચનામૃત" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- updated from JS when the theme changes -->
    <meta name="theme-color" content="#161311" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before anything draws: the iPhone app's status bar takes its colour from this first frame -->
    <script>
      try {
        var light = localStorage.getItem("theme") === "light"
        document.documentElement.classList.toggle("dark", !light)
        document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#fbf9f3" : "#161311")
      } catch (e) {}
    </script>
    <title>વચનામૃત અમૃત બિંદુ · Vachanamrut Amrut Bindu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
